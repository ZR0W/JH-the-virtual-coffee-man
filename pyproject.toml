[project]
name = "coffee-kb"
dynamic = ["version"]
description = "Personal knowledge base distilled from James Hoffmann's public YouTube videos (Phase 1: data collection)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Minimum, not exact: yt-dlp breaks and gets fixed often. Upgrade before each run:
    #   uv lock --upgrade-package yt-dlp && uv sync
    "yt-dlp>=2025.10.22",
    "httpx>=0.27",
]

[project.scripts]
coffee-kb = "coffee_kb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/coffee_kb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/coffee_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
